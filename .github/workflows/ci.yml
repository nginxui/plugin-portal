name: CI

# Lints, type checks, tests and builds every change. A push to main then
# deploys staging (portal-staging.nginxui.com); production deploys only when
# run by hand with target production. Deploys apply the D1 migrations first.
# Each environment ("staging", "production") holds CLOUDFLARE_API_TOKEN with
# Workers, D1 and R2 edit on the account; protect "production" with required
# reviewers in the repository settings.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CLOUDFLARE_ACCOUNT_ID: 9b281dd2ab36041a82b8b35a7a14c5de

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  deploy:
    needs: check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
    concurrency:
      group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error title=Not deployed::CLOUDFLARE_API_TOKEN is not set in the ${TARGET} environment."
            exit 1
          fi
          if [ "${TARGET}" = production ]; then
            bun run db:migrate
            bun run deploy
          else
            bun run db:migrate:staging
            bun run deploy:staging
          fi
